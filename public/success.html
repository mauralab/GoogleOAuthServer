<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизація успішна</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 420px;
        }

        .icon {
            font-size: 60px;
            color: #22c55e;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 12px;
        }

        p {
            color: #555;
        }
    </style>
</head>
<body>
<div class="card">
    <div class="icon">✅</div>
    <h1>Авторизація успішна</h1>
    <p>Ваш обліковий запис Google успішно підключено.</p>
    <p>Тепер ви можете закрити цю вкладку та повернутися до Telegram.</p>
</div>
</body>
</html>
